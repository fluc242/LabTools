
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labtools"
version = "0.1.0"
description = "Python tools for experimental physics"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<2.5", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["labtools*"]
